configuration:
  app_log_level:
    name: Log level
    description: Controls the add-on log verbosity.
  disable_log_colors:
    name: Disable log colors
    description: Print logs without color formatting.
  mdns_network_interface:
    name: mDNS network interface
    description: Limit mDNS to a specific network interface.
  heap_size_mb:
    name: Node.js heap limit (MB)
    description: Set the maximum heap size; 0 selects a value automatically based on available memory.
